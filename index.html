<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b35"><link rel="manifest" href="manifest.json"><title>Thai Master</title><style> *{box-sizing:border-box}body{margin:0;background:#101e20;color:#eaf5ef;font:16px system-ui}main{max-width:620px;margin:auto;padding:20px}h1{font-size:27px}small,p{color:#b2c9c4}button,select{font:inherit;color:inherit;background:#24433f;border:1px solid #42665e;border-radius:14px;padding:15px;cursor:pointer}button{width:100%;text-align:left;margin:5px 0}button:disabled{opacity:.7}button.primary{background:#b4edc9;color:#123b35;font-weight:bold;text-align:center}section{background:#192f30;border-radius:20px;padding:20px;margin:14px 0}.thai{font-size:48px;text-align:center;margin:24px 0;overflow-wrap:anywhere}.stats{display:flex;gap:12px}.stats section{flex:1;margin:0}.stats strong{font-size:28px;display:block}.good{background:#245c40}.bad{background:#733c40}nav{display:flex;gap:8px}nav button{text-align:center;padding:10px}input{max-width:100%} </style><main><header><h1>🇹🇭 Thai Master</h1><small>毎日少しずつ、タイ語が読めるように。</small></header><nav><button onclick="home()">ホーム</button><button onclick="records()">記録</button></nav><div id="app"></div></main><script>
const raw={子音:`ก|k|コー・カイ（鶏）;ข|kh|コー・カイ（卵）;ฃ|kh|コー・クワット（廃字）;ค|kh|コー・クワーイ（水牛）;ฅ|kh|コー・コン（廃字）;ฆ|kh|コー・ラカン（鐘）;ง|ng|ゴー・グー（蛇）;จ|ch|チョー・チャーン（皿）;ฉ|ch|チョー・チン（シンバル）;ช|ch|チョー・チャーン（象）;ซ|s|ソー・ソー（鎖）;ฌ|ch|チョー・チュー（木）;ญ|y|ヨー・イン（女性）;ฎ|d|ドー・チャダー（冠）;ฏ|t|トー・パタック（突き棒）;ฐ|th|トー・ターン（台）;ฑ|th|トー・モントー;ฒ|th|トー・プータオ（老人）;ณ|n|ノー・ネーン（小僧）;ด|d|ドー・デック（子供）;ต|t|トー・タオ（亀）;ถ|th|トー・トゥン（袋）;ท|th|トー・タハーン（兵士）;ธ|th|トー・トン（旗）;น|n|ノー・ヌー（鼠）;บ|b|ボー・バイマイ（葉）;ป|p|ポー・プラー（魚）;ผ|ph|ポー・プン（蜂）;ฝ|f|フォー・ファー（蓋）;พ|ph|ポー・パーン（盆）;ฟ|f|フォー・ファン（歯）;ภ|ph|ポー・サムパオ（帆船）;ม|m|モー・マー（馬）;ย|y|ヨー・ヤック（鬼）;ร|r|ロー・ルア（船）;ล|l|ロー・リン（猿）;ว|w|ウォー・ウェーン（指輪）;ศ|s|ソー・サーラー（東屋）;ษ|s|ソー・ルーシー（仙人）;ส|s|ソー・スア（虎）;ห|h|ホー・ヒープ（箱）;ฬ|l|ロー・チュラー（凧）;อ|母音の台・声門閉鎖音|オー・アーン（鉢）;ฮ|h|ホー・ノックフーク（梟）`,母音:`-ะ|a（短）|ア;-า|aa（長）|アー;-ิ|i（短）|イ;-ี|ii（長）|イー;-ึ|ue（短）|ウに近い音;-ื|uee（長）|長いウに近い音;-ุ|u（短）|ウ;-ู|uu（長）|ウー;เ-ะ|e（短）|エ;เ-|ee（長）|エー;แ-ะ|ae（短）|広いエ;แ-|aee（長）|広いエー;โ-ะ|o（短）|オ;โ-|oo（長）|オー;ไ-|ai|アイ;ใ-|ai|アイ;เ-า|ao|アオ;-ำ|am|アム`,日常:`สวัสดี|こんにちは|サワッディー;ขอบคุณ|ありがとう|コープクン;ขอโทษ|ごめんなさい|コートート;ใช่|はい|チャイ;ไม่|いいえ・否定|マイ;ไป|行く|パイ;มา|来る|マー;กิน|食べる|キン;ดื่ม|飲む|ドゥーム;น้ำ|水|ナーム;ข้าว|ご飯|カーオ;บ้าน|家|バーン;เพื่อน|友達|プアン;วันนี้|今日|ワンニー;พรุ่งนี้|明日|プルンニー;เมื่อวาน|昨日|ムアワーン;ดี|良い|ディー;มาก|とても|マーク;น้อย|少ない|ノーイ;ร้อน|暑い|ローン;หนาว|寒い|ナーオ;อะไร|何|アライ;ที่ไหน|どこ|ティーナイ;ใคร|誰|クライ;เท่าไหร่|いくら|タオライ;ชอบ|好き|チョープ;รัก|愛する|ラック;นอน|寝る|ノーン;ตื่น|起きる|トゥーン;ทำงาน|働く|タムガーン;เงิน|お金|グン;เวลา|時間|ウェーラー;หิว|空腹|ヒウ;อร่อย|おいしい|アロイ;เข้าใจ|理解する|カオチャイ;ไม่รู้|知らない|マイルー;ได้|できる|ダイ;ไม่ได้|できない|マイダイ;หนึ่ง|1|ヌン;สอง|2|ソーン;สาม|3|サーム;สี่|4|シー;ห้า|5|ハー;หก|6|ホック;เจ็ด|7|チェット;แปด|8|ペート;เก้า|9|ガーオ;สิบ|10|シップ`,ゲーム:`รอ|待つ|ロー;ช่วย|助ける|チュアイ;ระวัง|気をつけて|ラワン;ถอย|下がる|トーイ;ตี|攻撃する・叩く|ティー;ตาย|死ぬ|ターイ;ชนะ|勝つ|チャナ;แพ้|負ける|ペー;เก่งมาก|とても上手|ゲンマーク;ไม่เป็นไร|大丈夫|マイペンライ;ศัตรู|敵|サットルー;ทีม|チーム|ティーム;เล่น|遊ぶ・プレイする|レン;เกม|ゲーム|ゲーム;ซ้าย|左|サーイ;ขวา|右|クワー;เร็ว|速い|レオ;ช้า|遅い|チャー;พร้อม|準備できた|プローム;หนี|逃げる|ニー`,文章:`ไปไหน|どこに行くの？|パイナイ;กินข้าวหรือยัง|ご飯食べた？|キンカーオルーヤン;สบายดีไหม|元気？|サバーイディーマイ;ไม่เข้าใจ|分からない|マイカオチャイ;พูดช้าๆ หน่อย|少しゆっくり話して|プートチャーチャーノイ;ช่วยด้วย|助けて|チュアイドゥアイ;รอก่อน|ちょっと待って|ローゴーン;ไปด้วยกัน|一緒に行こう|パイドゥアイガン;เล่นเกมไหม|ゲームする？|レンゲームマイ;เจอกันพรุ่งนี้|また明日|チューガンプルンニー`};
const data=Object.entries(raw).flatMap(([cat,s])=>s.split(';').map((v,i)=>{let [w,a,r]=v.split('|');return {id:cat+i,cat,w,a,r}}));let state={};try{state=JSON.parse(localStorage.getItem('thai-master-v1')||'{}')}catch{};state.items??={};state.days??=[];const app=document.getElementById('app');function save(){try{localStorage.setItem('thai-master-v1',JSON.stringify(state))}catch{alert('端末への保存ができません。')}}function day(){return new Date().toLocaleDateString('sv-SE')}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function home(){app.innerHTML=`<div class="stats"><section><small>習得（正解3回以上）</small><strong>${Object.values(state.items).filter(x=>x.streak>=3).length}</strong> / ${data.length}</section><section><small>学習日数</small><strong>${state.days.length}</strong>日</section></div><section><h2>学習コース</h2>${Object.keys(raw).map(c=>`<button onclick="course('${c}')">${c}　<small>${data.filter(x=>x.cat===c).length}項目</small></button>`).join('')}<button onclick="start('復習')">苦手・期限到来の復習</button></section><section><h3>声調の基礎</h3><p>タイ語には平声・低声・下降声・高声・上昇声の5声があります。声調は子音のクラス、母音の長短、末子音、声調記号の組み合わせで決まります。カタカナは目安です。</p></section>`}function course(c){app.innerHTML=`<section><h2>${c}</h2><button class="primary" onclick="start('${c}')">10問クイズ</button><button onclick="cards('${c}',0)">単語・文字カード</button></section>`}function speak(w){if(!('speechSynthesis'in window))return alert('読み上げ非対応');let u=new SpeechSynthesisUtterance(w);u.lang='th-TH';let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('th'));if(v)u.voice=v;else return alert('端末にタイ語音声を追加してください。');speechSynthesis.speak(u)}function cards(c,i){let a=data.filter(x=>x.cat===c),x=a[i];app.innerHTML=`<section><small>${i+1} / ${a.length}</small><div class="thai">${x.w}</div><button onclick="this.outerHTML='<p>${x.a} ／ ${x.r}</p>'">答えを見る</button><button onclick="speak('${x.w}')">🔊 音声</button><nav><button onclick="cards('${c}',${Math.max(0,i-1)})">前へ</button><button onclick="cards('${c}',${(i+1)%a.length})">次へ</button></nav></section>`}let quiz=[],idx=0,score=0,opts=[];function start(c){let pool=c==='復習'?data.filter(x=>state.items[x.id]&&state.items[x.id].due<=Date.now()):data.filter(x=>x.cat===c);if(!pool.length){app.innerHTML='<section>復習対象はまだありません。</section>';return}quiz=shuffle(pool).slice(0,10);idx=score=0;question()}function question(){if(idx>=quiz.length){app.innerHTML=`<section><h2>学習完了！</h2><div class="thai">${score} / ${quiz.length}</div><button class="primary" onclick="home()">ホームへ</button></section>`;return}let x=quiz[idx];opts=shuffle([x.a,...shuffle([...new Set(data.filter(y=>y.cat===x.cat&&y.a!==x.a).map(y=>y.a))]).slice(0,3)]);app.innerHTML=`<section><small>問題 ${idx+1} / ${quiz.length}</small><div class="thai">${x.w}</div><button onclick="speak('${x.w}')">🔊 音声</button><p>意味・音を選んでください</p>${opts.map((a,i)=>`<button class="option" onclick="answer(${i})">${a}</button>`).join('')}<div id="feedback"></div></section>`}function answer(i){let x=quiz[idx],ok=opts[i]===x.a;document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(opts[j]===x.a)b.classList.add('good');else if(j===i)b.classList.add('bad')});let s=state.items[x.id]||{streak:0,total:0,correct:0};s.total++;if(ok){score++;s.correct++;s.streak++}else s.streak=0;s.due=Date.now()+(ok?Math.min(30,2**(s.streak-1))*86400000:0);state.items[x.id]=s;if(!state.days.includes(day()))state.days.push(day());save();document.getElementById('feedback').innerHTML=`<p>${ok?'正解！':'不正解'}　${x.a} ／ ${x.r}</p><button class="primary" onclick="idx++;question()">次へ</button>`}function records(){let a=Object.values(state.items),n=a.reduce((s,x)=>s+x.total,0),k=a.reduce((s,x)=>s+x.correct,0);app.innerHTML=`<section><h2>学習記録</h2><p>回答数 ${n}　正答率 ${n?Math.round(k/n*100):0}%</p><p>学習日数 ${state.days.length}日</p><button onclick="backup()">バックアップを保存</button><p>バックアップから復元</p><input type="file" accept=".json" onchange="restore(this)"></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='thai-master-backup.json';a.click()}async function restore(el){try{let s=JSON.parse(await el.files[0].text());if(!s.items||!Array.isArray(s.days))throw 0;state=s;save();records()}catch{alert('無効なファイル')}}home();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
