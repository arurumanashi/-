const raw={子音:`ก|k|コー・カイ（鶏）;ข|kh|コー・カイ（卵）;ฃ|kh|コー・クワット（廃字）;ค|kh|コー・クワーイ（水牛）;ฅ|kh|コー・コン（廃字）;ฆ|kh|コー・ラカン（鐘）;ง|ng|ゴー・グー（蛇）;จ|ch|チョー・チャーン（皿）;ฉ|ch|チョー・チン（シンバル）;ช|ch|チョー・チャーン（象）;ซ|s|ソー・ソー（鎖）;ฌ|ch|チョー・チュー（木）;ญ|y|ヨー・イン（女性）;ฎ|d|ドー・チャダー（冠）;ฏ|t|トー・パタック（突き棒）;ฐ|th|トー・ターン（台）;ฑ|th|トー・モントー;ฒ|th|トー・プータオ（老人）;ณ|n|ノー・ネーン（小僧）;ด|d|ドー・デック（子供）;ต|t|トー・タオ（亀）;ถ|th|トー・トゥン（袋）;ท|th|トー・タハーン（兵士）;ธ|th|トー・トン（旗）;น|n|ノー・ヌー（鼠）;บ|b|ボー・バイマイ（葉）;ป|p|ポー・プラー（魚）;ผ|ph|ポー・プン（蜂）;ฝ|f|フォー・ファー（蓋）;พ|ph|ポー・パーン（盆）;ฟ|f|フォー・ファン（歯）;ภ|ph|ポー・サムパオ（帆船）;ม|m|モー・マー（馬）;ย|y|ヨー・ヤック（鬼）;ร|r|ロー・ルア（船）;ล|l|ロー・リン（猿）;ว|w|ウォー・ウェーン（指輪）;ศ|s|ソー・サーラー（東屋）;ษ|s|ソー・ルーシー（仙人）;ส|s|ソー・スア（虎）;ห|h|ホー・ヒープ（箱）;ฬ|l|ロー・チュラー（凧）;อ|母音の台・声門閉鎖音|オー・アーン（鉢）;ฮ|h|ホー・ノックフーク（梟）`,母音:`-ะ|a（短）|ア;-า|aa（長）|アー;-ิ|i（短）|イ;-ี|ii（長）|イー;-ึ|ue（短）|ウに近い音;-ื|uee（長）|長いウに近い音;-ุ|u（短）|ウ;-ู|uu（長）|ウー;เ-ะ|e（短）|エ;เ-|ee（長）|エー;แ-ะ|ae（短）|広いエ;แ-|aee（長）|広いエー;โ-ะ|o（短）|オ;โ-|oo（長）|オー;ไ-|ai|アイ;ใ-|ai|アイ;เ-า|ao|アオ;-ำ|am|アム`,日常:`สวัสดี|こんにちは|サワッディー;ขอบคุณ|ありがとう|コープクン;ขอโทษ|ごめんなさい|コートート;ใช่|はい|チャイ;ไม่|いいえ・否定|マイ;ไป|行く|パイ;มา|来る|マー;กิน|食べる|キン;ดื่ม|飲む|ドゥーム;น้ำ|水|ナーム;ข้าว|ご飯|カーオ;บ้าน|家|バーン;เพื่อน|友達|プアン;วันนี้|今日|ワンニー;พรุ่งนี้|明日|プルンニー;เมื่อวาน|昨日|ムアワーン;ดี|良い|ディー;มาก|とても|マーク;น้อย|少ない|ノーイ;ร้อน|暑い|ローン;หนาว|寒い|ナーオ;อะไร|何|アライ;ที่ไหน|どこ|ティーナイ;ใคร|誰|クライ;เท่าไหร่|いくら|タオライ;ชอบ|好き|チョープ;รัก|愛する|ラック;นอน|寝る|ノーン;ตื่น|起きる|トゥーン;ทำงาน|働く|タムガーン;เงิน|お金|グン;เวลา|時間|ウェーラー;หิว|空腹|ヒウ;อร่อย|おいしい|アロイ;เข้าใจ|理解する|カオチャイ;ไม่รู้|知らない|マイルー;ได้|できる|ダイ;ไม่ได้|できない|マイダイ;หนึ่ง|1|ヌン;สอง|2|ソーン;สาม|3|サーム;สี่|4|シー;ห้า|5|ハー;หก|6|ホック;เจ็ด|7|チェット;แปด|8|ペート;เก้า|9|ガーオ;สิบ|10|シップ`,ゲーム:`รอ|待つ|ロー;ช่วย|助ける|チュアイ;ระวัง|気をつけて|ラワン;ถอย|下がる|トーイ;ตี|攻撃する・叩く|ティー;ตาย|死ぬ|ターイ;ชนะ|勝つ|チャナ;แพ้|負ける|ペー;เก่งมาก|とても上手|ゲンマーク;ไม่เป็นไร|大丈夫|マイペンライ;ศัตรู|敵|サットルー;ทีม|チーム|ティーム;เล่น|遊ぶ・プレイする|レン;เกม|ゲーム|ゲーム;ซ้าย|左|サーイ;ขวา|右|クワー;เร็ว|速い|レオ;ช้า|遅い|チャー;พร้อม|準備できた|プローム;หนี|逃げる|ニー`,文章:`ไปไหน|どこに行くの？|パイナイ;กินข้าวหรือยัง|ご飯食べた？|キンカーオルーヤン;สบายดีไหม|元気？|サバーイディーマイ;ไม่เข้าใจ|分からない|マイカオチャイ;พูดช้าๆ หน่อย|少しゆっくり話して|プートチャーチャーノイ;ช่วยด้วย|助けて|チュアイドゥアイ;รอก่อน|ちょっと待って|ローゴーン;ไปด้วยกัน|一緒に行こう|パイドゥアイガン;เล่นเกมไหม|ゲームする？|レンゲームマイ;เจอกันพรุ่งนี้|また明日|チューガンプルンニー`};
const data=Object.entries(raw).flatMap(([cat,s])=>s.split(';').map((v,i)=>{let [w,a,r]=v.split('|');return {id:cat+i,cat,w,a,r}}));let state={};try{state=JSON.parse(localStorage.getItem('thai-master-v1')||'{}')}catch{};state.items??={};state.days??=[];const app=document.getElementById('app');function save(){try{localStorage.setItem('thai-master-v1',JSON.stringify(state))}catch{alert('端末への保存ができません。')}}function day(){return new Date().toLocaleDateString('sv-SE')}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function home(){app.innerHTML=`<div class="stats"><section><small>習得（正解3回以上）</small><strong>${Object.values(state.items).filter(x=>x.streak>=3).length}</strong> / ${data.length}</section><section><small>学習日数</small><strong>${state.days.length}</strong>日</section></div><section><h2>学習コース</h2>${Object.keys(raw).map(c=>`<button onclick="course('${c}')">${c}　<small>${data.filter(x=>x.cat===c).length}項目</small></button>`).join('')}<button onclick="start('復習')">苦手・期限到来の復習</button></section><section><h3>声調の基礎</h3><p>タイ語には平声・低声・下降声・高声・上昇声の5声があります。声調は子音のクラス、母音の長短、末子音、声調記号の組み合わせで決まります。カタカナは目安です。</p></section>`}function course(c){app.innerHTML=`<section><h2>${c}</h2><button class="primary" onclick="start('${c}')">10問クイズ</button><button onclick="cards('${c}',0)">単語・文字カード</button></section>`}function speak(w){if(!('speechSynthesis'in window))return alert('読み上げ非対応');let u=new SpeechSynthesisUtterance(w);u.lang='th-TH';let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('th'));if(v)u.voice=v;else return alert('端末にタイ語音声を追加してください。');speechSynthesis.speak(u)}function cards(c,i){let a=data.filter(x=>x.cat===c),x=a[i];app.innerHTML=`<section><small>${i+1} / ${a.length}</small><div class="thai">${x.w}</div><button onclick="this.outerHTML='<p>${x.a} ／ ${x.r}</p>'">答えを見る</button><button onclick="speak('${x.w}')">🔊 音声</button><nav><button onclick="cards('${c}',${Math.max(0,i-1)})">前へ</button><button onclick="cards('${c}',${(i+1)%a.length})">次へ</button></nav></section>`}let quiz=[],idx=0,score=0,opts=[];function start(c){let pool=c==='復習'?data.filter(x=>state.items[x.id]&&state.items[x.id].due<=Date.now()):data.filter(x=>x.cat===c);if(!pool.length){app.innerHTML='<section>復習対象はまだありません。</section>';return}quiz=shuffle(pool).slice(0,10);idx=score=0;question()}function question(){if(idx>=quiz.length){app.innerHTML=`<section><h2>学習完了！</h2><div class="thai">${score} / ${quiz.length}</div><button class="primary" onclick="home()">ホームへ</button></section>`;return}let x=quiz[idx];opts=shuffle([x.a,...shuffle([...new Set(data.filter(y=>y.cat===x.cat&&y.a!==x.a).map(y=>y.a))]).slice(0,3)]);app.innerHTML=`<section><small>問題 ${idx+1} / ${quiz.length}</small><div class="thai">${x.w}</div><button onclick="speak('${x.w}')">🔊 音声</button><p>意味・音を選んでください</p>${opts.map((a,i)=>`<button class="option" onclick="answer(${i})">${a}</button>`).join('')}<div id="feedback"></div></section>`}function answer(i){let x=quiz[idx],ok=opts[i]===x.a;document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(opts[j]===x.a)b.classList.add('good');else if(j===i)b.classList.add('bad')});let s=state.items[x.id]||{streak:0,total:0,correct:0};s.total++;if(ok){score++;s.correct++;s.streak++}else s.streak=0;s.due=Date.now()+(ok?Math.min(30,2**(s.streak-1))*86400000:0);state.items[x.id]=s;if(!state.days.includes(day()))state.days.push(day());save();document.getElementById('feedback').innerHTML=`<p>${ok?'正解！':'不正解'}　${x.a} ／ ${x.r}</p><button class="primary" onclick="idx++;question()">次へ</button>`}function records(){let a=Object.values(state.items),n=a.reduce((s,x)=>s+x.total,0),k=a.reduce((s,x)=>s+x.correct,0);app.innerHTML=`<section><h2>学習記録</h2><p>回答数 ${n}　正答率 ${n?Math.round(k/n*100):0}%</p><p>学習日数 ${state.days.length}日</p><button onclick="backup()">バックアップを保存</button><p>バックアップから復元</p><input type="file" accept=".json" onchange="restore(this)"></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='thai-master-backup.json';a.click()}async function restore(el){try{let s=JSON.parse(await el.files[0].text());if(!s.items||!Array.isArray(s.days))throw 0;state=s;state.lessons??={};state.practice??={};save();records()}catch{alert('無効なファイル')}}state.lessons??={};state.practice??={};
const lessons=[
['タイ文字の仕組み','タイ語は子音を中心に母音を付けて音節を作ります。左から右へ読みますが、母音は子音の前後上下に置かれます。単語間に必ず空白があるわけではありません。','ก + า = กา（kaa）','文字の中心は？|子音|母音だけ|数字|声調だけ'],
['子音とは？','子音は音節の始めなどに使う音です。44文字のうちฃ・ฅは現在ほぼ使われません。同じ音でも異なる文字があります。','ก = k ／ ข・ค = kh','子音の伝統的な文字数は？|44|26|50|32'],
['基本子音','まず ก k、ด d、ต t、บ b、ป p、ม m、น n、ง ng を覚えます。k/t/p は息を強く出さず、kh/th/ph は息を出します。ng は日本語の語中の鼻音に近い音です。','กา ดา ตา บา ปา มา นา งา','ม の頭子音は？|m|n|k|p'],
['母音とは？','母音は子音と組み合わせる音です。◌は子音の位置を示す教材用の印です。母音の位置と読む順序は一致しないことがあります。','◌า → กา ／ เ◌ → เก','เ◌ はどこに付く？|左|右|上|下'],
['基本母音','まず า aa、ี ii、ู uu、เ◌ ee、โ◌ oo を学びます。aa は長いア、ii は長いイです。カタカナは目安です。','กา กี กู เก โก','กี の母音は？|ii|aa|uu|ee'],
['組み合わせ','子音の音と母音の音をつなげます。文字名そのものを連結するわけではありません。','ม + า = มา（maa、来る）','มา の読みは？|maa|mii|naa|kuu'],
['残りの子音','子音一覧で残りを少しずつ覚えましょう。頭子音が同じでも声調の分類が違う場合があります。','ข・ค = kh ／ ผ・พ = ph','พ の頭子音は？|ph|p|f|m'],
['短母音と長母音','母音の長さで意味が変わります。短い音と長い音を区別しましょう。末子音があると母音の表記が変わることもあります。','กะ / กา ／ ติ / ตี','า は？|長母音|短母音|末子音|声調記号'],
['複合母音とその他','เ◌ีย ia、เ◌ือ uea、◌ัว ua は複合母音。ไ◌・ใ◌ は ai、เ◌า は ao、◌ำ は am。短形や末子音付きの形もあります。','เสีย / เรือ / ตัว / ไป','ไ◌ の音は？|ai|ao|am|ua'],
['末子音','末子音は音節の最後の音。代表的な音は k、t、p、ng、n、m、y、w。ก は末尾で k、ด は t、บ は p になります。破裂音は息を放出せず止めます。','มาก maak ／ กิน kin ／ รูป ruup','มาก の末子音は？|k|t|p|n'],
['子音の3分類','中子音は ก จ ฎ ฏ ด ต บ ป อ。高子音は ข ฃ ฉ ฐ ถ ผ ฝ ศ ษ ส ห。残りは低子音です。分類は声調を決めるために使います。','ก 中 ／ ข 高 ／ ค 低','ก の分類は？|中子音|高子音|低子音|母音'],
['5種類の声調','平声・低声・下降声・高声・上昇声があります。高さの変化が意味を区別します。音声は友達に確認してもらいましょう。','มา maa 平 ／ หม่า màa 低 ／ ม่า mâa 下降 ／ ม้า máa 高 ／ หมา mǎa 上昇','声調は何種類？|5|4|3|2'],
['声調記号','声調記号は ่ ้ ๊ ๋ の4種類。記号と声調は一対一ではありません。例えば ่ は中・高子音では低声、低子音では下降声です。','กา / ก่า / ก้า / ก๊า / ก๋า','声調記号は何種類？|4|5|3|2'],

['特殊な読み方','ห が低子音の一部に先行すると高子音の規則を適用します。例えば หมา は h を発音せず maa の上昇声。์ は消音に関わる記号です。','หมา ／ หนู ／ จันทร์','หมา の ห は？|発音せず声調に関わる|必ず h と読む|母音|末子音'],

const oldHome=home;home=function(){state.lessons??={};state.practice??={};oldHome();app.insertAdjacentHTML('afterbegin',`<section><small>v0.2 ／ 基礎学習 ${Object.keys(state.lessons).length}/16講</small><h2>ゼロからタイ語</h2><button class="primary" onclick="lectureList()">📘 基本講習編<br><small style="color:#245344">文字の仕組みを理解する</small></button><button style="background:#263e53" onclick="practiceList()">🧠 基本練習編<br><small>問題で定着させる</small></button><p>音声：端末のタイ語合成音声（ネイティブ確認前）</p></section>`)};
function lectureList(){app.innerHTML='<section><h2>基本講習編</h2>'+lessons.map((l,i)=>`<button onclick="lecture(${i})">${state.lessons[i]?'✓ ':''}第${i+1}講　${l[0]}</button>`).join('')+'</section>'}
function lecture(i){let l=lessons[i];app.innerHTML=`<section><small>第${i+1}講 / 16</small><h2>${l[0]}</h2><p style="line-height:1.9">${l[1]}</p><div class="example">${l[2]}</div>${l[2].match(/[ก-ฮ][ก-๙]*/g)?.filter(w=>w.length>1).map(w=>`<button onclick="speak('${w}')">🔊 ${w}</button><button onclick="speak('${w}',0.75)">ゆっくり ${w}</button>`).join('')||''}${i===2||i===6?'<button onclick="cards(\'子音\',0)">子音44文字カード</button>':''}${i===4||i===8?'<button onclick="cards(\'母音\',0)">母音カード</button>':''}<button class="primary" onclick="state.lessons[${i}]=true;save();lectureList()">講習を修了する</button><button onclick="beginPractice(${i})">この講習の確認問題</button><button onclick="lectureList()">講習一覧</button>${i<15?`<button onclick="state.lessons[${i}]=true;save();lecture(${i+1})">修了して次の講習へ</button>`:''}</section>`}
const extra=[['ก','k',2],['ด','d',2],['ต','t',2],['บ','b',2],['ป','p',2],['น','n',2],['ง','ng',2],['กา','kaa',5],['กี','kii',5],['กู','kuu',5],['เก','kee',5],['โก','koo',5],['มา','maa',5],['มี','mii',5],['กิน','n',9],['รูป','p',9],['มาก','k',9],['จ','中子音',10],['ข','高子音',10],['ค','低子音',10],['กา','平声',13],['ขา','上昇声',13],['คา','平声',13],['กัด','低声',13],['รัก','高声',13],['มาก','下降声',13]];
let pq=[],pi=0,ps=0,pm=0;const bank=lessons.map((l,i)=>{let [q,a,...wrong]=l[3].split('|');return {id:'l'+i,i,q,a,wrong}}).concat(extra.map(([w,a,i],j)=>({id:'e'+j,i,q:w+' の'+(i===2?'頭子音':i===5?'読み':i===9?'末子音':i===10?'分類':'声調')+'は？',a,wrong:[...new Set(extra.filter(x=>x[2]===i&&x[1]!==a).map(x=>x[1]))]})));
function practiceList(){app.innerHTML=`<section><h2>基本練習編</h2><button class="primary" onclick="beginPractice(-1)">総合テスト（最大10問）</button><button onclick="beginPractice(-2)">学習済み範囲の復習</button><button onclick="beginPractice(-3)">苦手克服</button>${lessons.map((l,i)=>`<button onclick="beginPractice(${i})">第${i+1}講 ${l[0]}</button>`).join('')}<button onclick="course('子音')">子音44文字の識別練習</button><button onclick="course('母音')">母音識別練習</button></section>`}
function beginPractice(i){pm=i;let pool=bank.filter(q=>i===-1||i===-2&&state.lessons[q.i]||i===-3&&state.practice[q.id]?.miss||q.i===i);pq=shuffle(pool).slice(0,10);pi=ps=0;if(!pq.length){app.innerHTML='<section>対象の問題がありません。<button onclick="practiceList()">戻る</button></section>';return}practiceQuestion()}
function practiceQuestion(){if(pi>=pq.length){app.innerHTML=`<section><h2>結果 ${ps}/${pq.length}</h2><p>${ps/pq.length>=.8?'合格！ 次の講習へ進もう。':'関連講習を復習しよう。'}</p><button onclick="beginPractice(${pm})">もう一度</button><button onclick="practiceList()">練習一覧</button><button onclick="lectureList()">講習一覧</button></section>`;return}let q=pq[pi],opts=shuffle([q.a,...shuffle(q.wrong).slice(0,3)]);app.innerHTML=`<section><small>${pi+1}/${pq.length}</small><h2>${q.q}</h2><div id="poptions"></div><div id="pfeedback"></div></section>`;opts.forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{let ok=a===q.a;if(ok)ps++;state.practice[q.id]={miss:!ok};if(!state.days.includes(day()))state.days.push(day());save();document.querySelectorAll('#poptions button').forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('good');else if(x===b)x.classList.add('bad')});document.getElementById('pfeedback').innerHTML=`<p>${ok?'正解！':'正解：'+q.a}</p><p>${lessons[q.i][1]}</p><button onclick="lecture(${q.i})">関連講習を読む</button><button class="primary" onclick="pi++;practiceQuestion()">次へ</button>`};document.getElementById('poptions').append(b)})}

home();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
